name: Publish (NPM)

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    outputs:
      packageVersion: ${{ steps.outputVersion.outputs.packageVersion }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish

      - name: Output version
        id: outputVersion
        run: echo "packageVersion=$(cat package.json | jq -r '.version')" >> $GITHUB_OUTPUT

  trigger-cdn-deploy:
    needs: publish
    uses: ./.github/workflows/release-deploy.yml
    with:
      version: ${{ needs.publish.outputs.packageVersion }}
    secrets: inherit
